services:
  - type: web
    name: aptitude-registry-api
    runtime: python
    repo: https://github.com/aptitude-stack/registery
    branch: master
    region: virginia
    plan: starter
    buildCommand: uv sync --frozen --no-dev
    # preDeployCommand: uv run alembic upgrade head && uv run python scripts/check_alembic_at_head.py
    startCommand: uv run fastapi run --entrypoint app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /healthz
    autoDeployTrigger: off
    domains:
      - api.aptitude-registry.dev
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: prod
      - key: APP_NAME
        value: aptitude-registry
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: auto
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: ACTIVE_POLICY_PROFILE
        value: default
      - key: SEMANTIC_DISCOVERY_MODE
        value: "off"
      - key: SEMANTIC_EMBEDDING_PROVIDER
        value: openai
      - key: SEMANTIC_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SEMANTIC_EMBEDDING_INDEX_KEY
        value: openai:text-embedding-3-small:description-tags-v1
      - key: SEMANTIC_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_SERVICE_TOKENS_JSON
        sync: false
      - key: ALLOWED_HOSTS_JSON
        sync: false
