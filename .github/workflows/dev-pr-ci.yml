name: Dev PR CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BUILDKIT_PROGRESS: plain

jobs:
  dev-pr-gate:
    name: Dev PR Gate
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/aptitude_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/aptitude_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run quality gate
        run: make _ci-quality

      - name: Run test gate
        run: make _ci-test

      - name: Build app image for smoke test
        run: make _ci-image

      - name: Run smoke gate
        run: APP_IMAGE=y0ncha/aptitude-registry:latest make _ci-smoke

      - name: Tear down compose services
        if: always()
        run: make _ci-down
