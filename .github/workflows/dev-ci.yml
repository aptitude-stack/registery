name: Dev CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BUILDKIT_PROGRESS: plain

jobs:
  dev-pr-gate:
    name: Dev PR Gate
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aptitude
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aptitude

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run quality checks
        run: make quality

      - name: Run tests
        run: make test-unit

      - name: Import app entrypoint
        run: make import-check

      - name: Start compose database
        run: |
          docker compose --ansi=never --progress=plain up -d db
          for attempt in $(seq 1 30); do
            if docker compose --ansi=never --progress=plain exec -T db pg_isready -U postgres -d aptitude >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --ansi=never --progress=plain exec -T db pg_isready -U postgres -d aptitude

      - name: Run database migrations
        run: make migrate-up

      - name: Run integration tests
        run: make test-integration

      - name: Validate Prometheus config and rules
        run: make prometheus-check

      - name: Validate observability compose profile
        run: make observability-config-check

      - name: Build app image for smoke test
        run: make docker-build

      - name: Container smoke test
        run: APP_IMAGE=y0ncha/aptitude-registry:latest make docker-smoke

      - name: Tear down compose services
        if: always()
        run: make observability-down
