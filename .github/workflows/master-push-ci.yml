name: Master Push CI

on:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  final-local-gate:
    name: Final Local Gate
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/aptitude_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/aptitude_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run quality gate
        run: make _ci-quality

      - name: Run test gate
        run: make _ci-test

  production-deploy:
    name: Migrate Neon and Deploy Render
    needs:
      - final-local-gate
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Check required deployment secrets
        run: |
          : "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL GitHub secret is required}"
          : "${OPENAI_API_KEY:?OPENAI_API_KEY GitHub secret is required}"
          : "${RENDER_DEPLOY_HOOK_URL:?RENDER_DEPLOY_HOOK_URL GitHub secret is required}"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install production dependencies
        run: uv sync --frozen --no-dev

      - name: Verify OpenAI embedding configuration
        run: uv run python scripts/check_openai_embeddings.py

      - name: Migrate Neon to Alembic head
        run: uv run alembic upgrade head

      - name: Verify Neon is at Alembic head
        run: uv run python scripts/check_alembic_at_head.py

      - name: Create GitHub production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/deployments" \
              -f ref="${GITHUB_SHA}" \
              -f environment=production \
              -f description="Render production deploy" \
              -F auto_merge=false \
              -f required_contexts[] \
              -F production_environment=true \
              --jq .id
          )"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"

      - name: Mark GitHub deployment in progress
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=in_progress \
            -f environment=production \
            -f environment_url="${PRODUCTION_BASE_URL:-https://api.aptitude-registry.dev}" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Render deploy triggered after Neon migration verification"

      - name: Trigger Render deploy for this commit
        env:
          REF: ${{ github.sha }}
        run: |
          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
          esac
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${REF}"

      - name: Verify production health and readiness
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: PRODUCTION_BASE_URL="${PRODUCTION_BASE_URL:-https://api.aptitude-registry.dev}" make _ci-production-smoke

      - name: Mark GitHub deployment successful
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=success \
            -f environment=production \
            -f environment_url="${PRODUCTION_BASE_URL:-https://api.aptitude-registry.dev}" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Production health and readiness checks passed"

      - name: Mark GitHub deployment failed
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=failure \
            -f environment=production \
            -f environment_url="${PRODUCTION_BASE_URL:-https://api.aptitude-registry.dev}" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Render deploy trigger or production smoke failed"
