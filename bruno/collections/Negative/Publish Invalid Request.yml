info:
  name: Publish Invalid Request
  type: http
  seq: 1000
http:
  method: POST
  url: '{{baseUrl}}/skills/{{negative_invalid_slug}}'
  headers:
  - name: Accept
    value: application/json
  - name: Authorization
    value: Bearer {{publishToken}}
  body:
    type: multipart-form
    data:
    - name: metadata
      value: |-
        {
          "intent": "create_skill",
          "version": "1.0.0",
          "metadata": {
            "name": "Invalid Postman Skill",
            "description": "Invalid publish payload for negative coverage",
            "tags": ["postman", "negative"],
            "inputs_schema": {
              "type": "object"
            },
            "outputs_schema": {
              "type": "object"
            },
            "token_estimate": 50,
            "maturity_score": 0.5,
            "security_score": 0.5
          },
          "relationships": {
            "depends_on": [
              {
                "slug": "{{sanity_dependency_slug}}",
                "version_constraint": "latest"
              }
            ],
            "extends": [],
            "conflicts_with": [],
            "overlaps_with": []
          }
        }
    - name: bundle
      value: "@file(../../fixtures/invalid.tar.zst)"
runtime:
  scripts:
  - type: before-request
    code: "const requestName = 'Publish Invalid Request';\nconst resetFlowStarts =\
      \ new Set(['Healthz', 'Publish Invalid Request']);\n\nconst setDefault = (name,\
      \ value) => {\n  const current = bru.getVar(name);\n  if (typeof current ===\
      \ 'undefined' || current === null || current === '') {\n    bru.setVar(name,\
      \ value);\n  }\n};\n\nsetDefault('sanity_version_1', '1.0.0');\nsetDefault('sanity_version_2',\
      \ '2.0.0');\nsetDefault('negative_missing_version', '9.9.9');\nsetDefault('invalid_slug',\
      \ 'invalid slug');\nsetDefault('invalid_version', 'not-a-semver');\nsetDefault('sanity_dependency_slug',\
      \ '');\nsetDefault('sanity_extension_slug', '');\nsetDefault('sanity_overlap_slug',\
      \ '');\nsetDefault('sanity_primary_slug', '');\nsetDefault('negative_invalid_slug',\
      \ '');\nsetDefault('negative_duplicate_slug', '');\nsetDefault('negative_missing_slug',\
      \ '');\nsetDefault('sanity_primary_content_digest', '');\n\nlet runId = bru.getVar('runId');\n\
      \nif (resetFlowStarts.has(requestName) || !runId) {\n  runId = `${Date.now()}-${Math.floor(Math.random()\
      \ * 100000)}`;\n  bru.setVar('runId', runId);\n  bru.setVar('sanity_dependency_slug',\
      \ `postman.dep.${runId}`);\n  bru.setVar('sanity_extension_slug', `postman.ext.${runId}`);\n\
      \  bru.setVar('sanity_overlap_slug', `postman.overlap.${runId}`);\n  bru.setVar('sanity_primary_slug',\
      \ `postman.primary.${runId}`);\n  bru.setVar('negative_invalid_slug', `postman.invalid.${runId}`);\n\
      \  bru.setVar('negative_duplicate_slug', `postman.duplicate.${runId}`);\n  bru.setVar('negative_missing_slug',\
      \ `postman.missing.${runId}`);\n  bru.setVar('sanity_primary_content_digest',\
      \ '');\n}"
  - type: tests
    code: "const json = res.getBody();\n\ntest('Status is 422', function () {\n  expect(res.getStatus()).to.equal(422);\n\
      });\n\ntest('Invalid publish returns the normalized API error envelope', function\
      \ () {\n  expect(json.error.code).to.eql('INVALID_REQUEST');\n  expect(json.error.details.errors).to.be.an('array').and.not.empty;\n\
      \  expect(\n    json.error.details.errors.some(\n      (item) =>\n        Array.isArray(item.loc) &&\n\
        item.loc.includes('body') &&\n        item.loc.includes('metadata'),\n    ),\n\
      \  ).to.eql(true);\n});\n\nbru.runner.setNextRequest(res.getStatus() === 422\
      \ ? 'Seed Duplicate Skill Version' : null);"
settings:
  encodeUrl: true
