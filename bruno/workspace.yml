docs: |-
  # aptitude-server
  
  `aptitude-server` is the authoritative registry backend in the Aptitude ecosystem.
  It persists immutable skill metadata, `.tar.zst` bundle artifacts, lifecycle
  state, provenance snapshots, derived discovery indexes, and audit data in PostgreSQL.
  
  The server owns data-local work: publication, discovery candidate generation,
  direct authored dependency reads, exact metadata/content fetches, governance,
  audit, semantic recall expansion, and operational telemetry. Resolver/client
  components own decision-local work such as reranking, dependency solving, and
  execution planning.
  
  Discovery stays on `POST /discovery` with a slug-only response. Lexical search
  remains primary; when semantic discovery is enabled, the registry embeds the
  required `query` text. Context coordinates are used only for slug-level
  co-usage ranking.
  
  Canonical references:
  - API contract: `docs/reference/api-contract.md`
  - Documentation hub: `docs/README.md`
  - OpenAPI spec: `specs/aptitude-openapi.json`
