[project]
name = "aptitude-registry"
version = "0.3.0"
description = "aptitude-registry foundation service skeleton"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]==0.136.0",
    "opentelemetry-api>=1.30.0",
    "pydantic-settings==2.14.0",
    "python-dotenv>=1.1.1",
    "psycopg[binary]==3.3.3",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.45.0",
    "pydantic==2.13.3",
    "pydantic-extra-types==2.11.2",
    "python-multipart==0.0.26",
    "zstandard>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "pytest==9.0.3",
    "pytest-asyncio>=0.26.0",
    "ruff==0.15.11",
]
otel = [
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-psycopg>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a running PostgreSQL instance",
    "unit: fast isolated tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["app"]
