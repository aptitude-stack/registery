name: aptitude-local

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15.17}
    container_name: aptitude-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aptitude}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aptitude}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - aptitude-postgres-data:/var/lib/postgresql/data

  test-db:
    profiles: ["test"]
    image: ${POSTGRES_IMAGE:-postgres:15.17}
    container_name: aptitude-test-postgres
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-aptitude_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEST_POSTGRES_USER:-postgres} -d ${TEST_POSTGRES_DB:-aptitude_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - aptitude-test-postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: .
    image: ${APP_IMAGE:-y0ncha/aptitude-registry:local}
    container_name: aptitude-server
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/aptitude
      AUTH_SERVICE_TOKENS_JSON: '[{"token_id":"reader-token","secret_digest":"5f2a948f1a0f51d636721e4381eaf64fc8032a03b540a12da0645e0edc564084","scopes":["read"],"active":true},{"token_id":"publisher-token","secret_digest":"99e880bea53395534bf471d5d086ac2b2f6d45c6fe7c6c9ac7f6225cbe19c559","scopes":["read","publish"],"active":true},{"token_id":"admin-token","secret_digest":"f0f642b692ba908c91a9afe3c53878700b32e66c8132fc071109b4af48625d46","scopes":["read","publish","admin"],"active":true}]'
      ALLOWED_HOSTS_JSON: '["127.0.0.1","localhost","server"]'
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: INFO
      PORT: 8000
      UVICORN_RELOAD: "false"
      OTEL_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    build:
      context: .
    image: ${APP_IMAGE:-y0ncha/aptitude-registry:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/aptitude
      ALLOWED_HOSTS_JSON: '["127.0.0.1","localhost","server"]'
      APP_ENV: ${APP_ENV:-prod}
      OTEL_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  demo-seed:
    profiles: ["demo"]
    build:
      context: .
    image: ${APP_IMAGE:-y0ncha/aptitude-registry:local}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/aptitude
      ALLOWED_HOSTS_JSON: '["127.0.0.1","localhost","server"]'
      APP_ENV: ${APP_ENV:-prod}
      OTEL_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    command: ["python", "-m", "app.bootstrap.seed_demo"]
    restart: "no"

volumes:
  aptitude-postgres-data:
  aptitude-test-postgres-data:
    name: aptitude-test-postgres-data
