name: aptitude-tests

services:
  test-db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg15}
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-aptitude_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEST_POSTGRES_USER:-postgres} -d ${TEST_POSTGRES_DB:-aptitude_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
